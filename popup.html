<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-color: #1a1b26;
            --prompt-cyan: #7dcfff;
            --prompt-purple: #bb9af7;
            --text-main: #c0caf5;
            --status-bg: #7aa2f7;
            --status-fg: #1a1b26;
            --time-color: #565f89;
        }
        body {
            width: 450px;
            height: 300px;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: linear-gradient(rgba(26, 27, 38, 0.85), rgba(26, 27, 38, 0.85)), url('https://w.wallhaven.cc/full/85/wallhaven-85m9p1.jpg');
            background-size: cover;
            background-position: center;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #terminal {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            font-size: 13px;
            scrollbar-width: none;
        }
        #terminal::-webkit-scrollbar { display: none; }

        .line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            white-space: pre-wrap;
        }
        .content { display: flex; gap: 8px; }
        .timestamp { color: var(--time-color); font-size: 11px; }

        .prompt-symbol-top { color: var(--prompt-cyan); font-weight: bold; margin-right: 5px; }
        .prompt-symbol-main { color: var(--prompt-purple); font-weight: bold; }

        .input-area {
            display: flex;
            align-items: center;
            padding: 0 15px 10px;
            gap: 8px;
        }
        .input-container {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        input, #suggestion-hint {
            background: transparent;
            border: none;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 13px;
            margin: 0;
            padding: 0;
            outline: none;
            line-height: 1.2;
        }
        input {
            color: var(--text-main);
            width: 100%;
            position: relative;
            z-index: 2;
        }
        #suggestion-hint {
            position: absolute;
            left: 0;
            color: #565f89;
            z-index: 1;
            pointer-events: none;
            white-space: pre;
        }

        .status-bar {
            background-color: var(--status-bg);
            color: var(--status-fg);
            font-size: 11px;
            padding: 2px 10px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }
        .status-left { display: flex; gap: 10px; }
        .mode-indicator { background: #3d59a1; padding: 0 5px; margin-right: 5px; }
        
        .output { color: #9ece6a; margin-left: 20px; margin-bottom: 5px; }
        .error { color: #f7768e; }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <div class="input-area">
        <span class="prompt-symbol-top">~</span>
        <span class="prompt-symbol-main">❯</span>
        <div class="input-container">
            <input type="text" id="cmd-input" autofocus spellcheck="false" autocomplete="off">
            <span id="suggestion-hint"></span>
        </div>
    </div>
    <div class="status-bar">
        <div class="status-left">
            <span class="mode-indicator">0</span>
            <span>jmy@hollow-guard</span>
        </div>
        <div id="clock">--:--</div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
